[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rust-sandbox"
version = "0.2.0"
description = "Python ctypes binding for rust-sandbox (rsb) — rootless Linux process isolation engine (requires librsb_ffi.so on LD_LIBRARY_PATH or RSB_FFI_LIB)"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Shura5860" }]
keywords = ["linux", "sandbox", "landlock", "seccomp", "security", "isolation", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Shura5860/rust-sandbox"
Repository = "https://github.com/Shura5860/rust-sandbox"
Issues = "https://github.com/Shura5860/rust-sandbox/issues"

[tool.setuptools]
py-modules = ["rsb"]
