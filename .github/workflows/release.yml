name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Allow unprivileged userns capabilities on Ubuntu 24.04 runners
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run test suite
        run: cargo test --workspace

      - name: Build release artifacts
        run: cargo build --workspace --release

      - name: Package release archive & checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="rust-sandbox-${TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}/include" "dist/${PKG}/python"
          cp target/release/rsb "dist/${PKG}/rsb"
          cp target/release/librsb_ffi.so "dist/${PKG}/librsb_ffi.so"
          cp bindings/c/rsb.h "dist/${PKG}/include/rsb.h"
          cp bindings/python/rsb.py "dist/${PKG}/python/rsb.py"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${PKG}/"
          (cd dist && tar -czf "${PKG}.tar.gz" "${PKG}" && sha256sum "${PKG}.tar.gz" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            "dist/rust-sandbox-${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --title "rust-sandbox ${TAG}" \
            --generate-notes
