name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  linux-check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu

      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cross-check aarch64-unknown-linux-gnu compilation
        run: cargo check --workspace --all-targets --target aarch64-unknown-linux-gnu

      - name: Check rsb-net without default smoltcp feature
        run: cargo check -p rsb-net --no-default-features

      - name: Allow unprivileged userns capabilities on Ubuntu 24.04 runners
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run unit, integration, fuzz, and escape tests
        run: cargo test --workspace

      - name: Build release artifacts (CLI + librsb_ffi.so)
        run: cargo build --workspace --release

      - name: Verify CLI info & Python ctypes FFI binding
        run: |
          ./target/release/rsb info
          python3 bindings/python/rsb.py
