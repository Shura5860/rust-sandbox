[package]
name = "rsb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rsb-core = { path = "../crates/rsb-core" }
rsb-net = { path = "../crates/rsb-net", default-features = false }

[[bin]]
name = "toml_profile"
path = "fuzz_targets/toml_profile.rs"
test = false
bench = false
doc = false

[[bin]]
name = "tls_sni"
path = "fuzz_targets/tls_sni.rs"
test = false
bench = false
doc = false

[[bin]]
name = "dns_query"
path = "fuzz_targets/dns_query.rs"
test = false
bench = false
doc = false
